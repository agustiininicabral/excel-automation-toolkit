[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-automation-toolkit"
version = "1.0.0"
description = "Validated Excel report generation and business reporting toolkit"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7"]

[project.scripts]
excel-report = "excel_toolkit.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["excel_toolkit"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
